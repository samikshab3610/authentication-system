<!DOCTYPE html>
<html>

<head>
    <title>Verify Email</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Verify your email</h2>

    <p>Enter your email and the 6-digit code we sent you.</p>

    <form id="otpForm" autocomplete="off">
        <input type="email" id="otpEmail" placeholder="Email" required autocomplete="off"><br><br>
        <input type="text" id="otp" placeholder="6-digit code" maxlength="6" required autocomplete="off"><br><br>
        <button type="submit">Verify</button>
    </form>

    <script src="verify-otp.js"></script>
</body>

</html>
